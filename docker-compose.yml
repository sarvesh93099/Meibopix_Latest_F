services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_DEVICE: ${TORCH_DEVICE:-cpu}
    container_name: meibography-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DEBUG: ${DEBUG:-false}
      ENABLE_CAMERA: ${ENABLE_CAMERA:-false}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/meibography.db}
      MODEL_PATH: /app/backend/meibography_models
      UPLOAD_FOLDER: /app/data/uploads
      REPORT_FOLDER: /app/data/reports
      FRONTEND_DIST_DIR: /app/frontend/dist
      OPENCV_THREADS: ${OPENCV_THREADS:-1}
      TORCH_THREADS: ${TORCH_THREADS:-2}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-2}
      WAITRESS_THREADS: ${WAITRESS_THREADS:-4}
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/data
      - ./backend/meibography_models:/app/backend/meibography_models:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: meibography-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  backend-data:
